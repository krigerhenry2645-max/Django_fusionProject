{% extends 'master.html' %}
{% load static %}
{% block title %} students {% endblock %}

{% block content %}
    <div class="container">
    <div class="row">
        <div class="col-12">
            <table class="table">
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>score</th>
                    <th>age</th>

                </tr>
                {% for student in students %}
                    <tr>
                        <td>{{student.names}}</td>
                        <td>{{ student.email }}</td>
                        <td>{{ student.score }}</td>
                        <td>{{ student.age }}</td>
                    </tr>

                {% endfor %}
            </table>
        </div>
    </div>
    </div>

{% endblock %}
